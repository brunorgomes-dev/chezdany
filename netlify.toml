[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA: qualquer rota sem arquivo correspondente serve o index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# HTML sempre revalidado
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# JS/CSS com hash no nome: cache longo
[[headers]]
  for = "/app-*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/app-*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Imagens: cache de 30 dias
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
